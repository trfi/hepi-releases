name: Tauri Auto Re-Hash, Sign & Update Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rehash-sign-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Tauri CLI
        run: |
          npm install -g @tauri-apps/cli

      - name: Download setup file from latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --pattern "Hepi_*_x64-setup.exe" --clobber || true
          gh release download --pattern "latest.json" --clobber || true

      - name: Modify Hash, Re-sign, and Update latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Append random bytes to end-of-file to change binary hash
          EXE_FILE=$(ls Hepi_*_x64-setup.exe | head -n 1)
          echo -n "$(date +%s%N)_$RANDOM" >> "$EXE_FILE"
          
          # 2. Re-sign executable (Tauri CLI automatically writes signature to $EXE_FILE.sig)
          npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" "$EXE_FILE"
          
          # 3. Read raw signature string directly from the generated .sig file
          SIG_FILE="${EXE_FILE}.sig"
          NEW_SIG=$(cat "$SIG_FILE")

          # 4. Update existing latest.json using 'jq' to preserve other platforms (msi, etc.)
          LATEST_TAG=$(gh release view --json tagName -q .tagName)
          VERSION=$(echo "$EXE_FILE" | sed -E 's/Hepi_(.*)_x64-setup\.exe/\1/')
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${LATEST_TAG}/${EXE_FILE}"
          
          # If the latest.json file downloaded does not exist, create a basic JSON structure first
          if [ ! -f "latest.json" ]; then
            echo '{"version":"","notes":"","pub_date":"","platforms":{}}' > latest.json
          fi

          # Use jq to update the version, pub_date, and overwrite the platform specifically with windows-x86_64-nsis
          jq --arg ver "$VERSION" \
             --arg date "$PUB_DATE" \
             --arg notes "Daily build updated on $(date -u +'%Y-%m-%d')" \
             --arg sig "$NEW_SIG" \
             --arg url "$DOWNLOAD_URL" \
             '.version = $ver | .pub_date = $date | .notes = $notes | .platforms["windows-x86_64-nsis"] = {"signature": $sig, "url": $url}' \
             latest.json > latest_temp.json && mv latest_temp.json latest.json

      - name: Overwrite assets in GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release view --json tagName -q .tagName)
          EXE_FILE=$(ls Hepi_*_x64-setup.exe | head -n 1)
          gh release upload "$LATEST_TAG" "$EXE_FILE" "${EXE_FILE}.sig" latest.json --clobber
